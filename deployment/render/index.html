<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Capture thoughts, connect ideas and explore your personal knowledge world.">
  <title>Idea Grove — A place for your thoughts</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/index.DdvT-Eqh.css">
</head>
<body>
  <div id="root" style="min-height:100vh">
    <div id="bootstrap-status" style="box-sizing:border-box;max-width:720px;margin:10vh auto;padding:28px;font:16px/1.5 system-ui,sans-serif;color:#3c4935;background:rgba(255,255,255,.92);border:1px solid rgba(60,73,53,.18);border-radius:18px;box-shadow:0 12px 40px rgba(40,50,35,.12)">
      Idea Grove bootstrap v6 — starting…
    </div>
  </div>
  <noscript>
    <div style="box-sizing:border-box;max-width:720px;margin:10vh auto;padding:28px;font:16px/1.5 system-ui,sans-serif">
      Idea Grove requires JavaScript to be enabled.
    </div>
  </noscript>
  <script>
    (function () {
      var status = document.getElementById("bootstrap-status");
      function fail(message) {
        if (status) {
          status.textContent = "Idea Grove bootstrap failed: " + message;
          status.style.color = "#8b2f2f";
          status.style.whiteSpace = "pre-wrap";
          status.style.overflowWrap = "anywhere";
        }
      }
      try {
        if (status) status.textContent = "Idea Grove bootstrap v6 — loading ES module…";
        window.addEventListener("error", function (event) {
          var detail = event.message || (event.target && event.target.src) || "Unknown browser script error";
          if (event.filename) detail += " (" + event.filename + ":" + event.lineno + ")";
          fail(detail);
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          fail(reason && (reason.stack || reason.message) ? (reason.stack || reason.message) : String(reason));
        });
        var script = document.createElement("script");
        script.type = "module";
        script.src = "/assets/recovered-entry-v6.js";
        script.onload = function () {
          window.setTimeout(function () {
            if (status && status.textContent === "Idea Grove bootstrap v6 — loading ES module…") {
              fail("The entry module downloaded but did not start. Check the browser console and the response for /assets/recovered-entry.js.");
            }
          }, 1500);
        };
        script.onerror = function () {
          fail("Could not load or parse /assets/recovered-entry.js. Check the Render deployment and asset response.");
        };
        document.head.appendChild(script);
        window.setTimeout(function () {
          if (status && status.textContent === "Idea Grove bootstrap v6 — loading ES module…") {
            fail("Timed out waiting for /assets/recovered-entry.js to start (20 seconds).");
          }
        }, 20000);
      } catch (error) {
        fail(error && error.stack ? error.stack : String(error));
      }
    })();
  </script>
</body>
</html>
