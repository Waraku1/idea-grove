<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Capture thoughts, connect ideas and explore your personal knowledge world.">
  <title>Idea Grove — A place for your thoughts</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/index.DdvT-Eqh.css">
</head>
<body>
  <div id="root" style="min-height:100vh">
    <div id="bootstrap-status" style="box-sizing:border-box;max-width:720px;margin:10vh auto;padding:28px;font:16px/1.5 system-ui,sans-serif;color:#3c4935;background:rgba(255,255,255,.92);border:1px solid rgba(60,73,53,.18);border-radius:18px;box-shadow:0 12px 40px rgba(40,50,35,.12)">
      Loading Idea Grove…
    </div>
  </div>
  <noscript>
    <div style="box-sizing:border-box;max-width:720px;margin:10vh auto;padding:28px;font:16px/1.5 system-ui,sans-serif">
      Idea Grove requires JavaScript to be enabled.
    </div>
  </noscript>
  <script type="module">
    const root = document.getElementById("root");
    const status = document.getElementById("bootstrap-status");

    function failure(error) {
      const message = error instanceof Error ? error.stack || error.message : String(error);
      console.error("Idea Grove bootstrap failure:", error);
      if (!root) return;
      root.innerHTML = "";
      const panel = document.createElement("div");
      panel.style.cssText = "box-sizing:border-box;max-width:900px;margin:10vh auto;padding:28px;font:16px/1.5 system-ui,sans-serif;color:#3c4935;background:rgba(255,255,255,.92);border:1px solid rgba(60,73,53,.18);border-radius:18px;box-shadow:0 12px 40px rgba(40,50,35,.12)";
      panel.innerHTML = "<h1 style='margin:0 0 12px;font-size:24px'>Idea Grove could not load</h1><p style='margin:0 0 12px'>The page itself loaded, but the interactive application failed during bootstrap.</p><pre style='margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace'></pre>";
      panel.querySelector("pre").textContent = message;
      root.appendChild(panel);
    }

    window.addEventListener("error", event => {
      if (event.error) failure(event.error);
    });
    window.addEventListener("unhandledrejection", event => failure(event.reason));

    try {
      if (status) status.textContent = "Loading Idea Grove application…";
      const [{ default: Grove }, sessionResponse] = await Promise.all([
        import("/assets/grove-BWXu0UId.js"),
        fetch("/session", { credentials: "same-origin", cache: "no-store" })
      ]);
      const session = sessionResponse.ok
        ? await sessionResponse.json()
        : { signedIn: false, userKey: "guest" };
      const { i: reactFactory, n: domFactory } = await import("/assets/framework-D_rUT4EX.js");
      const React = reactFactory();
      const ReactDOM = domFactory();
      if (!React || !ReactDOM || typeof ReactDOM.createRoot !== "function") {
        throw new Error("Recovered React runtime did not initialize.");
      }
      ReactDOM.createRoot(root).render(
        React.createElement(Grove, {
          signedIn: !!session.signedIn,
          signInPath: "/auth/sign-in",
          signInLabel: "Sign in with GitHub",
          standalone: true,
          userKey: session.userKey || "guest"
        })
      );
    } catch (error) {
      failure(error);
    }
  </script>
</body>
</html>
